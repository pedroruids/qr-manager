name: Funcionalidade
description: Algo novo que o produto passa a fazer
labels: ["tipo: funcionalidade"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: A dor concreta, em linguagem de utilizador. Não a solução.
      placeholder: Hoje, quem gere uma equipa não consegue saber...
    validations:
      required: true

  - type: textarea
    id: solucao
    attributes:
      label: O que vai ser feito
      description: O comportamento desejado, do ponto de vista de quem usa.
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Feito quando
      description: >-
        Critérios verificáveis por quem não participou na conversa.
        Máximo 5 — mais do que isso significa que o issue devia estar dividido.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: fora
    attributes:
      label: Fora de âmbito
      description: O que este issue explicitamente NÃO faz.
    validations:
      required: true

  - type: input
    id: design
    attributes:
      label: Design
      description: Caminho do mockup, ou "não aplicável".
      placeholder: docs/mockups/dashboard.html

  - type: textarea
    id: tecnico
    attributes:
      label: Contexto técnico
      description: Ficheiros/módulos prováveis, entidades envolvidas, dependências.
